<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DNI Digital</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><link rel="stylesheet" href="App.css"><style>body{background-color:#f2f2f2;padding-bottom:70px;margin:0}.fa,.fa-solid,.fas{font-family:"Font Awesome 6 Free"!important}.DNI-header{background-color:var(--color-primary);color:#fff;padding:0 16px;height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}.DNI-header .back-link{color:#fff;font-size:18px;display:flex;align-items:center;text-decoration:none}.DNI-header .titulo-header{font-size:20px;font-weight:500;margin:0;color:#fff;flex:1}.DNI-header .fa-arrow-rotate-right{color:#fff;font-size:18px}.body-milanesa{padding:14px}.cajaContainer{background-color:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden}.nombre-header{padding:20px 20px 8px 20px}.nombre-texto{color:#212121;font-weight:700;font-size:18px;margin:0;line-height:1.25}.image-section{background-color:#fff;padding:6px 0 16px 0;display:flex;flex-direction:column;align-items:center;width:100%;perspective:1000px}.imageContainer{width:90%;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.06)}.imageContainer img{width:100%;display:block;transition:transform .5s ease;transform-style:preserve-3d;backface-visibility:hidden}.rotate{animation:flip .4s cubic-bezier(.455,.03,.515,.955) both}@keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}.rotate2{animation:flip2 .4s cubic-bezier(.455,.03,.515,.955) both}@keyframes flip2{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}.circles-container{display:flex;justify-content:center;gap:7px;margin:14px 0 10px 0}.circle{width:10px;height:10px;border-radius:50%;transition:background .3s}.circle.blue{background-color:var(--color-primary)}.circle.grey{background-color:#c4c4c4}.update-info{font-size:14px;color:#424242;text-align:center;font-weight:400;margin-top:2px}.info-botones{display:flex;border-top:1px solid #e8e8e8}.btn-accion{flex:1;display:flex;justify-content:center;align-items:center;padding:16px 0;gap:10px;cursor:pointer;text-decoration:none;background:0 0;-webkit-tap-highlight-color:transparent}.btn-accion:active{background:#f5f5ff}.borde-izq{border-left:1px solid #e8e8e8}.btn-accion .fa-eye{color:var(--color-primary);font-size:18px}.btn-accion .fa-xmark{color:var(--color-primary);font-size:22px}.btn-accion span{color:#333;font-size:15px;font-weight:500}.vereficar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-top:1px solid #e8e8e8;cursor:pointer;background:#fff;-webkit-tap-highlight-color:transparent}.vereficar-left{display:flex;align-items:center;gap:12px}.qr-icon-svg{width:22px;height:22px;color:var(--color-primary)}.qr-text{font-weight:500;font-size:15px;color:#333}.chevron-qr{color:#9e9e9e;font-size:14px;transition:transform .3s}.qrDNI{display:none;padding:24px 20px;background-color:#fafafa;border-top:1px solid #e8e8e8;flex-direction:column;justify-content:center;align-items:center}.qrDNI.active2{display:flex;justify-content:center;align-items:center}.qrDNI img{display:block;margin:0 auto;width:260px;max-width:90%;height:auto}</style></head><body><header class="DNI-header"><a href="DNI.html" class="back-link"><i class="fa-solid fa-arrow-left"></i></a><h2 class="titulo-header">DNI Digital</h2><i class="fa-solid fa-arrow-rotate-right"></i></header><div class="body-milanesa"><div class="cajaContainer"><div class="nombre-header"><h3 id="nombre_completo" class="nombre-texto">Cargando...</h3></div><section class="image-section"><div class="imageContainer"><img src="#" alt="DNI" id="dni_img"></div><div class="circles-container"><div class="circle blue"></div><div class="circle grey"></div></div><div class="update-info">Última actualización <span id="update-date"></span> hs</div></section><div class="info-botones"><a href="DNI_Detalles.html" class="btn-accion"><i class="fa-solid fa-eye"></i> <span>Ver detalle</span> </a><a href="Mantenimiento.html" class="btn-accion borde-izq"><i class="fa-solid fa-xmark"></i> <span>Desactivar DNI</span></a></div><div class="vereficar" id="toggleDigitalButton"><div class="vereficar-left"><svg class="qr-icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="4" width="4" height="4" fill="currentColor"/><rect x="14" y="2" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="16" y="4" width="4" height="4" fill="currentColor"/><rect x="2" y="14" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="16" width="4" height="4" fill="currentColor"/><rect x="14" y="14" width="3" height="3" fill="currentColor"/><rect x="19" y="14" width="3" height="3" fill="currentColor"/><rect x="14" y="19" width="3" height="3" fill="currentColor"/><rect x="19" y="19" width="3" height="3" fill="currentColor"/></svg> <span class="qr-text">Verifica código QR</span></div><i class="fa-solid fa-chevron-down chevron-qr" id="flechaQR"></i></div><div class="qrDNI" id="digitalContainer"><img src="qr_dni.png" alt="QR Code" id="qr-img"></div></div></div><nav class="NavBar"><a href="Inicio.html" style="text-decoration:none"><div class="imagenes"><img src="ic_home_blue.png" alt="Inicio"> <span class="color2">Inicio</span></div></a><a href="Novedades.html" style="text-decoration:none"><div class="imagenes"><img src="ic_novedades_grey.png" alt="Novedades"> <span>Novedades</span></div></a><a href="Telefonos.html" style="text-decoration:none"><div class="imagenes"><img src="ic_telefonos_grey.png" alt="Teléfonos"> <span>Teléfonos</span></div></a><a href="#" style="text-decoration:none"><div class="imagenes"><img src="tina.png" alt="Tina" style="border-radius:50%"> <span>Tina</span></div></a></nav><script src="Datos.js"></script><script>const persona=datos[0];window.addEventListener("load",()=>{var e;document.getElementById("nombre_completo").textContent=(e=persona.Nombre+" "+persona.Apellido)?e.toLowerCase().replace(/(?:^|\s)\S/g,e=>e.toUpperCase()):"",document.getElementById("update-date").textContent=generarFechaActualizacion(),showImage()});const toggleBtn=document.getElementById("toggleDigitalButton"),qrContainer=document.getElementById("digitalContainer"),flecha=document.getElementById("flechaQR");let isQRVisible=!1;toggleBtn.addEventListener("click",()=>{isQRVisible=!isQRVisible,qrContainer.classList.toggle("active2",isQRVisible),flecha.style.transform=isQRVisible?"rotate(180deg)":"rotate(0deg)"});var images=["FRENTE.png","DORSO.png"],currentIndex=0,img=document.querySelector(".imageContainer img"),circles=document.querySelectorAll(".circle");function showImage(){img.src=images[currentIndex],circles.forEach((e,t)=>{e.className=t===currentIndex?"circle blue":"circle grey"})}function nextImage(){currentIndex<images.length-1&&(currentIndex++,showImage())}function prevImage(){currentIndex>0&&(currentIndex--,showImage())}var startTouchX=null,currentTouchX=null;img.addEventListener("touchstart",e=>startTouchX=e.touches[0].clientX),img.addEventListener("touchmove",e=>currentTouchX=e.touches[0].clientX),img.addEventListener("touchend",()=>{if(startTouchX&&currentTouchX){var e=currentTouchX-startTouchX;e>50?(prevImage(),img.classList.add("rotate2")):e<-50&&(nextImage(),img.classList.add("rotate")),img.addEventListener("animationend",function(){img.classList.remove("rotate","rotate2")},{once:!0}),startTouchX=null,currentTouchX=null}})</script></body></html>
