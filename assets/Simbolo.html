<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script src="https://kit.fontawesome.com/0fb265836e.js" crossorigin="anonymous"></script><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="App.css"><title>Símbolo Internacional - Mi Argentina</title><style>body{margin:0;padding:0;font-family:Roboto,sans-serif;background-color:#fff;overscroll-behavior:none;overflow:hidden}.app-wrapper{width:100vw;height:100vh;overflow:hidden;position:relative;background:#fff;display:flex;flex-direction:column}@media screen and (orientation:portrait){.app-wrapper{transform:rotate(90deg);transform-origin:center center;width:100vh;height:100vw;position:absolute;top:calc(50vh - 50vw);left:calc(50vw - 50vh)}}.DNI-header{background-color:var(--color-primary,#362fc1);padding:0 16px;height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}.DNI-header .Atras{width:24px;height:24px;filter:brightness(0) invert(1)}.DNI-header .titulo{color:#fff;font-size:18px;font-weight:500;margin:0}.viewer-section{display:flex;align-items:center;justify-content:center;flex:1;padding:10px;box-sizing:border-box}.image-viewer{position:relative;display:flex;flex-direction:row;align-items:center;justify-content:center;width:100%;max-width:800px;padding:0 10px;box-sizing:border-box}.card-wrapper{position:relative;width:calc(85vw * 1.65);max-width:min(90%,800px);aspect-ratio:1.65/1;perspective:1000px}@media screen and (orientation:landscape) and (max-height:600px){.card-wrapper{max-width:calc((100vh - 90px) * 1.65)}}.image-container{position:absolute;width:100%;height:100%;background-color:transparent;display:block}.card-bg{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}.qr-overlay{position:absolute;top:27%;left:11%;width:23%;aspect-ratio:1/1;z-index:10;mix-blend-mode:multiply}.simbolo-numero-overlay{position:absolute;top:71%;left:11%;width:23%;text-align:center;font-size:19px;font-family:Roboto,sans-serif;font-weight:700;color:#000;letter-spacing:2px;z-index:10}</style></head><body><div class="app-wrapper"><header class="DNI-header"><a href="DNI.html" style="display:flex;align-items:center"><i class="fa-solid fa-arrow-left" style="color:#fff;font-size:18px"></i></a><h2 class="titulo">Símbolo Internacional de Acceso</h2></header><div class="viewer-section"><div class="image-viewer"><div class="card-wrapper"><div id="front-card" class="image-container"><img class="card-bg" src="simbolo.png" alt="Símbolo Internacional"> <img class="qr-overlay" src="qr_simbolo.png" alt="QR Símbolo"><div id="simbolo-numero" class="simbolo-numero-overlay">243221</div></div></div></div></div></div><script src="Datos.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if("undefined"!=typeof datos&&datos.length>0){const e=datos[0];let t=17*(parseInt(e.DNI.replace(/\./g,""),10)||12345678)%9e5+1e5;document.getElementById("simbolo-numero").textContent=t.toString()}})</script></body></html>
