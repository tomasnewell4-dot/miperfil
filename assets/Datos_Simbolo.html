etElementById("valDNI").textContent=d;let l=parseInt(d.replace(/\./g,""),10)||12345678,a=17*l%9e5+1e5;document.getElementById("valNCI").textContent=a.toString();let m=13*l%9e8+1e8;document.getElementById("valCUD").textContent=m.toString();let c=e.Licencia?e.Licencia.Vencimiento:e.Vencimiento,i="2027-09-20";if(c&&c.includes("/")){let e=c.split("/");3===e.length&&(i=`${e[2]}-${e[1]}-${e[0]}`)}document.getElementById("valExpiraEn").textContent=i;const p=document.querySelector("#dominiosTable tbody");let r=e.Patente||"";if(""!==r.trim()){r.split(",").forEach(e=>{let t=document.createElement("tr"),n=document.createElement("td");n.textContent=e.trim().toUpperCase();let o=document.createElement("td");o.textContent=i+" 00:00:00",t.appendChild(n),t.appendChild(o),p.appendChild(t)})}else{let e=document.createElement("tr"),t=document.createElement("td");t.textContent="SIN ASIGNAR";let n=document.createElement("td");n.textContent=i+" 00:00:00",e.appendChild(t),e.appendChild(n),p.appendChild(e)}}})</script></body></html>
