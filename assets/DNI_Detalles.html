<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Detalle DNI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><link rel="stylesheet" href="App.css"><style>body{background-color:#f2f2f2;padding-bottom:70px;margin:0}.DNI-header{background-color:var(--color-primary);color:#fff;padding:0 16px;height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}.DNI-header .back-link{color:#fff;font-size:18px;display:flex;align-items:center;text-decoration:none}.DNI-header .titulo-header{font-size:20px;font-weight:500;margin:0;color:#fff;flex:1}.DNI-header .fa-arrow-rotate-right{color:#fff;font-size:18px}.body-detalles-dni{padding:14px}.INFOINFO{background-color:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden}.img-info{display:flex;justify-content:center;padding:28px 0 16px 0}.perfil-img{width:80px;height:80px;border-radius:50%;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.1)}.QRContainer{text-align:center;margin-bottom:16px;padding:0 20px}.QR{display:block;margin:0 auto;width:55%;max-width:200px;height:45px;object-fit:fill}.INFO{display:flex;flex-direction:column}.INFO-2{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:20px;padding:0 20px 20px 20px;border-bottom:1px solid #e8e8e8}.INFO-3{display:flex;flex-direction:column;gap:20px;padding:22px 20px 24px 20px}.data-dni p{margin:0;color:#757575;font-size:14px;font-weight:400;line-height:1}.data-dni b{display:block;margin-top:4px;color:#212121;font-size:16px;font-weight:700;line-height:1.2;word-break:break-word}</style></head><body><header class="DNI-header"><a href="DNI_Digital.html" class="back-link"><i class="fa-solid fa-arrow-left"></i></a><h2 class="titulo-header">DNI Digital</h2><i class="fa-solid fa-arrow-rotate-right"></i></header><div class="body-detalles-dni"><div class="INFOINFO"><div class="img-info"><img id="previewImage" class="perfil-img" src="perfil.jpg" alt="Foto Perfil"></div><div class="QRContainer"><img id="previewTramiteImage" class="QR" src="417.png" alt="Código de Barras"></div><div class="INFO"><div class="INFO-2"><div class="data-dni"><p>DNI</p><b id="DNI"></b></div><div class="data-dni"><p>Número de trámite</p><b id="Tramite"></b></div><div class="data-dni"><p>Fecha de emisión</p><b id="Emision"></b></div><div class="data-dni"><p>Fecha de vencimiento</p><b id="Vencimiento"></b></div></div><div class="INFO-3"><div class="data-dni"><p>Nombre</p><b id="Nombre"></b></div><div class="data-dni"><p>Apellido</p><b id="Apellido"></b></div><div class="data-dni"><p>Sexo</p><b id="Sexo"></b></div><div class="data-dni"><p>Fecha de nacimiento</p><b id="Nacimiento"></b></div><div class="data-dni"><p>Nacionalidad</p><b id="Nacionalidad"></b></div><div class="data-dni"><p>Lugar de nacimiento</p><b id="LugarNacimiento"></b></div><div class="data-dni"><p>Dirección</p><b id="Domicilio"></b></div></div></div></div></div><nav class="NavBar"><a href="Inicio.html" style="text-decoration:none"><div class="imagenes"><img src="ic_home_blue.png" alt="Inicio"> <span class="color2">Inicio</span></div></a><a href="Novedades.html" style="text-decoration:none"><div class="imagenes"><img src="ic_novedades_grey.png" alt="Novedades"> <span>Novedades</span></div></a><a href="Telefonos.html" style="text-decoration:none"><div class="imagenes"><img src="ic_telefonos_grey.png" alt="Teléfonos"> <span>Teléfonos</span></div></a><a href="#" style="text-decoration:none"><div class="imagenes"><img src="tina.png" alt="Tina" style="border-radius:50%"> <span>Tina</span></div></a></nav><script src="Datos.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const e=datos[0];document.getElementById("DNI").textContent=e.DNI.replace(/\./g,""),document.getElementById("Tramite").textContent=e.Tramite,document.getElementById("Emision").textContent=fechaANumeros(e.Emision),document.getElementById("Vencimiento").textContent=fechaANumeros(e.Vencimiento),document.getElementById("Nacimiento").textContent=fechaANumeros(e.Nacimiento),document.getElementById("Nombre").textContent=titleCase(e.Nombre),document.getElementById("Apellido").textContent=e.Apellido.toUpperCase(),document.getElementById("Sexo").textContent=e.Sexo,document.getElementById("Nacionalidad").textContent=e.Nacionalidad,document.getElementById("LugarNacimiento").textContent=(e.LugarNacimiento||"ARGENTINA").toUpperCase(),document.getElementById("Domicilio").textContent=e.Calle})</script></body></html>
